<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wildwood Survival</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12;font-family:Trebuchet MS,Arial,sans-serif;color:#fff;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none} .panel{position:absolute;background:rgba(10,14,20,.78);border:1px solid rgba(255,255,255,.13);box-shadow:0 4px 16px rgba(0,0,0,.25);border-radius:8px}
#stats{left:16px;top:14px;padding:9px 12px}#stats div{height:19px;font-weight:bold;font-size:13px;text-shadow:1px 1px 2px #000}.bar{width:112px;height:9px;background:#1b2027;border:1px solid #090b0e;border-radius:5px;margin:3px 0 5px}.fill{height:100%;border-radius:4px}.hp{background:#da4a58}.st{background:#46b5d6}.xp{background:#64c768}
#time{right:16px;top:14px;padding:8px 12px;text-align:center;font-size:12px;color:#dbe8ef}#time b{display:block;font-size:14px;color:#fff}
#hotbar{left:50%;bottom:15px;transform:translateX(-50%);display:flex;gap:5px;padding:6px;pointer-events:auto} .slot{width:48px;height:48px;border:2px solid #3d4650;border-radius:6px;background:rgba(20,27,35,.92);position:relative;text-align:center;color:#fff;cursor:pointer}.slot.sel{border-color:#f4d64a;box-shadow:0 0 9px rgba(244,214,74,.55)}.slot .key{position:absolute;left:4px;top:2px;font-size:9px;color:#aeb8c2}.slot .count{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:bold}.item{width:30px;height:30px;margin:7px auto;image-rendering:pixelated}
#craft{left:16px;bottom:76px;width:180px;padding:8px;pointer-events:auto}#craft h3{margin:0 0 6px;font-size:13px;color:#f1cf62;border-bottom:1px solid #444;padding-bottom:5px}.recipe{height:31px;border-radius:5px;background:rgba(255,255,255,.06);margin:3px 0;padding:5px 7px;font-size:11px;cursor:pointer}.recipe:hover{background:rgba(244,214,74,.18)}.recipe span{float:right;color:#b9c3cc}
#prompt{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);font-size:12px;text-shadow:1px 1px 2px #000;opacity:.9}
#touch{display:none;position:absolute;inset:0;pointer-events:none}#touch .move{pointer-events:auto;position:absolute;bottom:18px;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);font-size:27px;text-align:center;padding-top:12px}#leftTouch{left:16px}#rightTouch{left:86px}#jumpTouch{right:18px;bottom:84px}#mineTouch{right:18px;bottom:18px}
#death{display:none;position:absolute;inset:0;background:rgba(20,5,5,.7);align-items:center;justify-content:center;flex-direction:column;text-align:center}#death h1{font-size:42px;margin:0 0 8px;color:#d95a58;text-shadow:3px 3px #380909}#death button{border:0;border-radius:7px;background:#ddd0a5;color:#332d20;font-weight:bold;padding:13px 24px;cursor:pointer}
#toast{position:absolute;left:50%;top:78px;transform:translateX(-50%) translateY(-10px);padding:8px 14px;border-radius:20px;background:rgba(10,14,20,.88);border:1px solid rgba(255,255,255,.15);font-size:12px;opacity:0;transition:.25s}.toast{opacity:1!important;transform:translateX(-50%) translateY(0)!important}
@media(max-width:760px),(pointer:coarse){#craft{display:none}#stats{left:8px;top:8px}#time{right:8px;top:8px}#hotbar{bottom:8px}#prompt{bottom:66px}.slot{width:42px;height:42px}.slot .item{transform:scale(.85);margin:5px auto}#touch{display:block}}
</style></head><body>
<canvas id="game"></canvas><div id="hud">
<div id="stats" class="panel"><div>HEALTH <span id="hpText"></span></div><div class="bar"><div id="hpBar" class="fill hp"></div></div><div>STAMINA</div><div class="bar"><div id="stBar" class="fill st"></div></div><div>LEVEL <span id="levelText"></span></div><div class="bar"><div id="xpBar" class="fill xp"></div></div></div>
<div id="time" class="panel"><b id="timeText">DAY 1</b><span id="biomeText">GREENLANDS</span></div>
<div id="craft" class="panel"><h3>CRAFTING</h3><div id="recipes"></div></div>
<div id="hotbar"></div><div id="prompt"></div><div id="toast"></div>
<div id="touch"><div id="leftTouch" class="move">◀</div><div id="rightTouch" class="move">▶</div><div id="jumpTouch" class="move">▲</div><div id="mineTouch" class="move">◆</div></div>
<div id="death"><h1>YOU DIED</h1><p>Your journey ends, but the wild waits.</p><button id="respawn">RESPAWN</button></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR=1;
const TILE=24,WORLD=180,HEIGHT=78;let world=[],camera={x:0,y:0},day=1,time=7,frame=0,paused=false;
const keys={};let mouse={x:0,y:0,down:false};
const COLORS={grass:'#69a83e',dirt:'#895438',stone:'#777b7a',wood:'#7a5031',leaf:'#315d32',sand:'#c9b46e',copper:'#c86642',ore:'#7c98aa',crystal:'#8fd7c7'};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function rnd(n){let x=Math.sin(n*128.17)*43758.5453;return x-Math.floor(x)}
function surfaceAt(x){return 46+Math.floor(Math.sin(x*.038)*5+Math.sin(x*.011)*7+Math.sin(x*.09)*2)}
function generate(){world=[];for(let x=0;x<WORLD;x++){let surface=surfaceAt(x),biome=x<48?'forest':x<110?'meadow':'desert';world[x]=[];for(let y=0;y<HEIGHT;y++){let b=0;if(y>=surface){if(y===surface)b=biome==='desert'?7:1;else if(y<surface+5)b=biome==='desert'?7:2;else b=y>57&&rnd(x*19+y*13)>.91?9:(rnd(x*37+y*41)>.965?10:3)}if(y>surface+16&&rnd(x*71+y*53)>.992)b=11;world[x][y]=b}
// Add blocky canopy trees to the forest and meadow.
if(biome!=='desert'&&x>8&&x<WORLD-8&&rnd(x*9)>0.955){for(let t=1;t<=4;t++)world[x][surface-t]=6;for(let dx=-2;dx<=2;dx++)for(let dy=-5;dy<=-3;dy++)if(Math.abs(dx)+Math.abs(dy)<5&&world[x+dx]&&world[x+dx][surface+dy]===undefined){}}}}
generate();
const player={x:24*TILE,y:(surfaceAt(24)-2)*TILE,vx:0,vy:0,w:16,h:30,on:false,hp:100,maxHp:100,stamina:100,level:1,xp:0,dir:1,inv:{wood:3,grass:0,dirt:2,stone:2,ore:0,crystal:0},sword:0};
let mobs=[],particles=[],drops=[];
function mobAt(x,y){return rnd(x*33+y*71)>.985}for(let x=20;x<WORLD;x+=1)if(mobAt(x,3)){} 
function spawnMob(){let side=player.x/TILE+(Math.random()<.5?-18:18);side=Math.max(5,Math.min(WORLD-5,side));let y=surfaceAt(Math.floor(side))*TILE-18;mobs.push({x:side*TILE,y:y,w:20,h:18,vx:0,vy:0,hp:30,max:30,type:Math.random()<.22?'slime':'zombie',hit:0})}
for(let i=0;i<7;i++)spawnMob();
const hot=['pick','sword','grass','dirt','stone','wood','crystal'];let selected=0;
const names=['Pickaxe','Sword','Grass','Dirt','Stone','Wood','Crystal'];
function icon(i){const d=document.createElement('canvas');d.width=30;d.height=30;const g=d.getContext('2d');g.imageSmoothingEnabled=false;let c=['#858a88','#bdc6c4','#69a83e','#895438','#777b7a','#8b5a35','#82cfc1'][i];g.fillStyle=c;if(i===0){g.fillRect(7,19,4,9);g.fillRect(5,7,20,4);g.fillRect(5,7,4,7);g.fillRect(21,7,4,7)}else if(i===1){g.fillStyle='#bfc8c4';g.fillRect(8,5,12,18);g.fillRect(12,21,5,8);g.fillStyle='#d8a644';g.fillRect(5,20,18,4)}else{g.fillRect(5,7,20,17);g.fillStyle=i===5?'#a87945':'rgba(255,255,255,.22)';g.fillRect(8,10,5,5);g.fillRect(17,16,5,5)}return d.toDataURL()}
function updateHotbar(){let el=document.getElementById('hotbar');el.innerHTML='';hot.forEach((name,i)=>{let slot=document.createElement('div');slot.className='slot'+(i===selected?' sel':'');slot.innerHTML='<span class="key">'+(i+1)+'</span><img class="item" src="'+icon(i)+'"><span class="count">'+(i>1?(player.inv[name]||0):'')+'</span>';slot.onclick=()=>selected=i;el.appendChild(slot)});let r=document.getElementById('recipes');r.innerHTML='';[['wood','Healing Potion','3 Wood','wood 3','heal'],['stone','Stone Sword','4 Stone','stone 4','sword'],['ore','Copper Armor','3 Ore','ore 3','armor'],['crystal','Crystal Heart','2 Crystal','crystal 2','heart']].forEach(a=>{let b=document.createElement('div');b.className='recipe';b.innerHTML=a[1]+' <span>'+a[2]+'</span>';b.onclick=()=>craft(a[3],a[4]);r.appendChild(b)})}
let toastTimer;
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('toast');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('toast'),1800)}
function craft(s,type){let [item,n]=s.split(' '),cost=+n;if((player.inv[item]||0)>=cost){player.inv[item]-=cost;if(type==='heal'){player.hp=Math.min(player.maxHp,player.hp+35);toast('Healing potion used')}else if(type==='sword'){player.sword++;toast('Stone sword upgraded')}else if(type==='armor'){player.armor=(player.armor||0)+5;player.maxHp+=5;player.hp+=5;toast('Armor forged')}else if(type==='heart'){player.maxHp+=15;player.hp=player.maxHp;toast('Crystal heart activated')}gainXp(8);updateHotbar()}else toast('Not enough '+item)}
updateHotbar();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(/^\d$/.test(e.key))selected=Math.max(0,Math.min(6,+e.key-1));if(e.key==='e')document.getElementById('craft').style.display=document.getElementById('craft').style.display==='none'?'block':'none'});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);canvas.addEventListener('contextmenu',e=>e.preventDefault());
function bindTouch(id,key,down){let e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();keys[key]=down;if(key==='mouse')mouse.down=true});e.addEventListener('pointerup',()=>{keys[key]=false;if(key==='mouse')mouse.down=false});e.addEventListener('pointercancel',()=>{keys[key]=false;if(key==='mouse')mouse.down=false})}bindTouch('leftTouch','a',true);bindTouch('rightTouch','d',true);bindTouch('jumpTouch',' ',true);bindTouch('mineTouch','mouse',true);
function solid(tx,ty){if(tx<0||tx>=WORLD||ty<0||ty>=HEIGHT)return ty>=HEIGHT||tx<0||tx>=WORLD;return world[tx][ty]!==0}
function collide(o,dx,dy){o.x+=dx;let l=o.x,r=o.x+o.w,t=o.y,b=o.y+o.h;if(dx){for(let y=Math.floor(t/TILE);y<=Math.floor((b-1)/TILE);y++)for(let x=Math.floor(l/TILE);x<=Math.floor((r-1)/TILE);x++)if(solid(x,y)){if(dx>0)o.x=x*TILE-o.w;else o.x=(x+1)*TILE}}o.y+=dy;l=o.x;r=o.x+o.w;t=o.y;b=o.y+o.h;o.on=false;if(dy){for(let y=Math.floor(t/TILE);y<=Math.floor((b-1)/TILE);y++)for(let x=Math.floor(l/TILE);x<=Math.floor((r-1)/TILE);x++)if(solid(x,y)){if(dy>0){o.y=y*TILE-o.h;o.on=true;o.vy=0}else{o.y=(y+1)*TILE;o.vy=0}}}}
function hitBlock(tx,ty){if(tx<0||tx>=WORLD||ty<0||ty>=HEIGHT||world[tx][ty]===0)return;let b=world[tx][ty];world[tx][ty]=0;if(b===1||b===7){player.inv.grass=(player.inv.grass||0)+1}else if(b===2){player.inv.dirt=(player.inv.dirt||0)+1}else if(b===3||b===9||b===10){player.inv.stone=(player.inv.stone||0)+1;if(b===10)player.inv.ore=(player.inv.ore||0)+1}else if(b===11){player.inv.crystal=(player.inv.crystal||0)+1}else if(b===6){player.inv.wood=(player.inv.wood||0)+1}for(let i=0;i<5;i++)particles.push({x:tx*TILE+12,y:ty*TILE+12,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:30,c:b===3?'#777b7a':'#895438'});updateHotbar()}
function placeBlock(tx,ty){if(world[tx][ty]!==0)return;let names2={grass:1,dirt:2,stone:3,wood:6,crystal:11},n=hot[selected];if(names2[n]){if((player.inv[n]||0)>0){world[tx][ty]=names2[n];player.inv[n]--;updateHotbar()}}}
function attack(mx,my){let ax=player.x+player.w/2+(player.dir*18),ay=player.y+12;for(let m of mobs){let cx=m.x+m.w/2,cy=m.y+m.h/2;if(Math.hypot(cx-ax,cy-ay)<34&&m.hit<=0){m.hp-=20+player.sword*5;m.hit=18;m.vx=player.dir*5;gainXp(8)}}}
function gainXp(n){player.xp+=n;if(player.xp>=player.level*30){player.xp=0;player.level++;player.maxHp+=10;player.hp=player.maxHp}}
function update(){frame++;time+=.004;if(time>=24){time-=24;day++}if(player.hp>0){let move=(keys.d?1:0)-(keys.a?1:0);if(move){player.vx+=move*.65;player.dir=move}else player.vx*=.75;player.vx=Math.max(-4.2,Math.min(4.2,player.vx));if((keys[' ']||keys.w)&&player.on&&player.stamina>8){player.vy=-8.1;player.stamina-=8}if(!player.on)player.vy+=.38;else if(player.stamina<100)player.stamina+=.25;player.vy=Math.min(12,player.vy);collide(player,player.vx,0);collide(player,0,player.vy);if(player.y>HEIGHT*TILE+100)player.hp=0}
for(let m of mobs){if(m.hp<=0){if(Math.random()<.2)drops.push({x:m.x,y:m.y,type:'ore',life:500}) ;continue}m.hit--;let dir=player.x>m.x?1:-1;m.vx+=dir*.08;m.vx*=.92;m.vy+=.38;m.vy=Math.min(8,m.vy);collide(m,m.vx,0);collide(m,0,m.vy);if(Math.hypot(player.x-m.x,player.y-m.y)<24&&frame%45===0){player.hp-=m.type==='slime'?5:8}}
if(mouse.down){let tx=Math.floor((mouse.x+camera.x)/TILE),ty=Math.floor((mouse.y+camera.y)/TILE);if(frame%8===0){let px=Math.floor((player.x+player.w/2)/TILE),py=Math.floor((player.y+player.h/2)/TILE);if(keys.mouse){tx=Math.floor(player.x/TILE)+player.dir*3;ty=Math.floor((player.y+player.h/2)/TILE)}if(Math.abs(tx-px)<6&&Math.abs(ty-py)<6){if(selected===0)hitBlock(tx,ty);else if(selected===1)attack(mouse.x+camera.x,mouse.y+camera.y);else placeBlock(tx,ty)}}}
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--}particles=particles.filter(p=>p.life>0);
mobs=mobs.filter(m=>m.hp>0||m.hit>-180);while(mobs.length<5&&Math.random()<.003){let tx=Math.max(5,Math.min(WORLD-5,Math.floor(player.x/TILE)+(Math.random()<.5?-18:18))),ty=surfaceAt(tx)*TILE-18;mobs.push({x:tx*TILE,y:ty,w:20,h:18,vx:0,vy:0,hp:30,max:30,type:time>20||time<5?'zombie':'slime',hit:0})}
for(let d of drops){d.y+=.8+d.life*.001;if(Math.abs(d.x-player.x)<20&&Math.abs(d.y-player.y)<25){player.inv.ore=(player.inv.ore||0)+1;d.life=0}}drops=drops.filter(d=>d.life>0);
if(player.hp<=0)document.getElementById('death').style.display='flex';camera.x+=(player.x-W/2-camera.x)*.08;camera.y+=(player.y-H*.55-camera.y)*.08;camera.x=Math.max(0,Math.min(WORLD*TILE-W,camera.x));camera.y=Math.max(0,Math.min(HEIGHT*TILE-H,camera.y));}
function sky(){let n=time<6||time>18,night=n?(time<12?0.45:(time>20?.7:.55)):0.08;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,night?'#10192e':'#79b8cf');g.addColorStop(1,night?'#1d2540':'#d5e6af');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=n?'#e6e1ba':'#ffe495';ctx.beginPath();ctx.arc(W-110,85,26,0,7);ctx.fill();ctx.globalAlpha=.5;ctx.fillStyle='#fff';for(let i=0;i<7;i++){let x=((i*230-camera.x*.12)% (W+180))-60,y=55+(i%3)*28;ctx.beginPath();ctx.ellipse(x,y,34,9,0,0,7);ctx.fill()}ctx.globalAlpha=1}
function block(x,y,b){let px=x*TILE-camera.x,py=y*TILE-camera.y;if(px<-TILE||px>W||py<-TILE||py>H)return;ctx.fillStyle=b===1?'#69a83e':b===7?'#c9b46e':b===2?'#895438':b===3?'#777b7a':b===9?'#738d9a':b===10?'#6d7d83':b===11?'#67c9b5':b===6?'#8b5a35':'#9b6842';ctx.fillRect(px,py,TILE,TILE);if(b===1||b===7){ctx.fillStyle=b===1?'#78b84b':'#d4c27c';ctx.fillRect(px,py,TILE,5)}else if(b===2||b===6){ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(px+3,py+4,5,5);ctx.fillRect(px+14,py+14,4,4)}else if(b===3||b===9||b===10||b===11){ctx.fillStyle=b===11?'#a8eee0':b===10?'#c86642':'rgba(255,255,255,.12)';ctx.fillRect(px+(x%3)*5,py+(y%2)*7,4,4)}}
function render(){sky();let sx=Math.floor(camera.x/TILE),sy=Math.floor(camera.y/TILE);for(let x=sx-1;x<sx+Math.ceil(W/TILE)+1;x++)for(let y=sy-1;y<sy+Math.ceil(H/TILE)+1;y++)if(x>=0&&x<WORLD&&y>=0&&y<HEIGHT&&world[x][y])block(x,y,world[x][y]);
for(let d of drops){ctx.fillStyle='#c86642';ctx.fillRect(d.x-camera.x,d.y-camera.y,8,8)}
for(let m of mobs){let x=m.x-camera.x,y=m.y-camera.y;if(m.type==='slime'){ctx.fillStyle='#62c66d';ctx.beginPath();ctx.arc(x+10,y+12,10,Math.PI,0);ctx.fillRect(x,y+12,20,6);ctx.fill()}else{ctx.fillStyle='#5d7068';ctx.fillRect(x,y,20,18);ctx.fillStyle='#d4a675';ctx.fillRect(x+4,y-5,12,8);ctx.fillStyle='#1a1a1a';ctx.fillRect(x+6,y-3,3,3);ctx.fillRect(x+12,y-3,3,3)}}
let px=player.x-camera.x,py=player.y-camera.y;ctx.fillStyle='#d2a173';ctx.fillRect(px+4,py+2,8,8);ctx.fillStyle='#6b3f27';ctx.fillRect(px+3,py,10,4);ctx.fillStyle='#4e79a8';ctx.fillRect(px+2,py+10,12,14);ctx.fillStyle='#d2a173';ctx.fillRect(px-1,py+13,3,10);ctx.fillRect(px+14,py+13,3,10);ctx.fillStyle='#392c24';ctx.fillRect(px+3,py+24,4,6);ctx.fillRect(px+10,py+24,4,6);
if(selected===1){ctx.fillStyle='#d4d8cf';ctx.save();ctx.translate(px+(player.dir>0?18:-2),py+14);ctx.rotate(player.dir*(frame%20<10?.4:-.4));ctx.fillRect(-2,-2,22,4);ctx.restore()}
for(let p of particles){ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle=p.c;ctx.fillRect(p.x-camera.x,p.y-camera.y,4,4)}ctx.globalAlpha=1;
for(let m of mobs){if(m.hp<m.max){let x=m.x-camera.x,y=m.y-camera.y-7;ctx.fillStyle='#222';ctx.fillRect(x,y,20,3);ctx.fillStyle='#d95a58';ctx.fillRect(x,y,20*m.hp/m.max,3)}}
let biome=player.x/TILE<48?'GREENLANDS':player.x/TILE<110?'MEADOW':'SUNSCAR DESERT';document.getElementById('biomeText').textContent=biome;document.getElementById('timeText').textContent='DAY '+day+'  '+(time<6?'DAWN':time<17?'DAY':time<20?'DUSK':'NIGHT');document.getElementById('hpText').textContent=Math.ceil(player.hp)+' / '+player.maxHp;document.getElementById('hpBar').style.width=(Math.max(0,player.hp)/player.maxHp*100)+'%';document.getElementById('stBar').style.width=player.stamina+'%';document.getElementById('levelText').textContent=player.level;document.getElementById('xpBar').style.width=(player.xp/(player.level*30)*100)+'%';let prompt=document.getElementById('prompt');prompt.textContent='Mining: Left click  •  Build: Select a block  •  Move: A/D or arrows';}
function loop(){update();render();requestAnimationFrame(loop)}document.getElementById('respawn').onclick=()=>{player.hp=player.maxHp;player.x=24*TILE;player.y=(surfaceAt(24)-2)*TILE;player.vx=0;player.vy=0;document.getElementById('death').style.display='none'};loop();
</script></body></html>
